# The gate: a clean clone must build and pass its own tests, with no secret in
# the tree and no known high/critical production advisory. Review this check
# before merging or deploying; GitHub does not currently require it on main.
# (Doctrine Laws 1 + 4, _toolkit/production-gate/ci-gate.yml, adapted.)
name: gate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Secret scan
        run: |
          PATTERNS='AIza[0-9A-Za-z_-]{30,}|nvapi-[0-9A-Za-z_-]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|sk-proj-[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]{20,}|cfoat_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|-----BEGIN [A-Z ]*PRIVATE KEY'
          if grep -rIlE "$PATTERNS" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude=package-lock.json .; then
            echo "::error::A live-key pattern is in the tree (file names above). Rotate the key; move it to env."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Production dependencies have no known high or critical advisory
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint
