# Spatial law: the layout gate, measured against the live site.
#
# What this job checks: every route of the deployed site, at every width where
# the layout changes, in a real browser, for holes, orphans, clipped text,
# rows that break and strand one item, actions pushed to opposite edges, and
# pages that scroll sideways.
#
# Why it measures the DEPLOYED site rather than a fresh build:
#
#   The build and unit tests run in the separate gate workflow. This check
#   measures the bytes a visitor receives. A push to main and the daily cron
#   observe production. A manual dispatch on main can still name an immutable
#   Pages preview. Any other ref starts no runners. Pull requests keep the
#   gate workflow, and a skipped dispatch is not a measurement pass.
#
#   The build-time gate still runs before every deploy, locally:
#     npm run spatial:gate      build -> measure copy -> prerender -> gate
#     npm run spatial:falsify   prove the gate bites by breaking the page
#
# The falsifier does NOT run here; the step summary says so. It needs a local,
# prerendered copy of the site. A gate that has never been shown to
# fail is not a gate; so the falsifier runs in the release chain, on the
# machine that deploys.
#
# Dossier URLs (/w/<slug>) are one template. The sitemap lists every row so
# search can find it; the receipt does not key each row. The run that did —
# 358 routes, about 49 minutes — failed "page without a receipt" on URLs the
# receipt was never meant to record, and on the slashless twin of every
# layout route the sitemap writes without a trailing slash.
#
# The night city behind the page is a full-screen fixed canvas. The gate reads
# a full-screen fixed layer as a modal and leaves it out of the chrome
# measurement, which is right here: the city is a backdrop under the work, it
# takes no height away from it, and the work's own probe (scripts/spatial/
# msh-probe.js) reports zero occluded text with it switched on.
name: Spatial law

on:
  # Not on pull_request. A PR push stays on the cheap gate workflow.
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Immutable watch-1de.pages.dev preview URL; blank checks production'
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    # Once a day, so a page that drifts without a commit is still caught.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  # One group for every workflow_dispatch, push, and schedule on this ref.
  # A different preview URL must not open a second group.
  group: spatial-law-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target:
    # Runners start only on main: a push, the daily cron, or a manual dispatch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.target.outputs.base }}
    steps:
      - name: Select the production or immutable preview target
        id: target
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          if [[ -z "$PREVIEW_URL" ]]; then
            target='https://watch.nonarkara.org/'
          elif [[ "$PREVIEW_URL" =~ ^https://[0-9a-f]{8}\.watch-1de\.pages\.dev/?$ ]]; then
            target="${PREVIEW_URL%/}/"
          else
            echo 'Expected an immutable https://<eight hex digits>.watch-1de.pages.dev/ preview' >&2
            exit 2
          fi
          echo "base=$target" >> "$GITHUB_OUTPUT"
  measure:
    needs: target
    # Same main-only guard as target. success() still applies, so a failed
    # or skipped target does not start the shard runners.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Each runner freshly loads its own routes at every required width.
    #
    # 30 minutes, measured. The slowest shard across the last three
    # successful runs took 13 minutes: 12 shards observed, 7 to 13 minutes,
    # and the same shard was the slow one every time. 30 is more than twice
    # that, so a slow runner day does not kill a legitimate sweep. 20 was
    # only 1.5x the measured worst case and would turn a slow day into a
    # gate failure that is not a measurement failure — the reader would be
    # told the layout broke when the layout was never measured. It was 50
    # before the minutes pass, which is a hung shard burning 50 minutes of
    # quota to say nothing.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install Chrome for the measurement browser
        # Not `apt-get install chromium-browser`: on ubuntu-latest that is a
        # snap transitional package, and a snap does not run inside a runner's
        # container. The gate measured nothing and read as a pass.
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable
      - name: Point the gate at that browser
        run: echo "CHROME_PATH=$(command -v google-chrome || command -v chrome)" >> "$GITHUB_ENV"
      - name: Collect this shard's browser measurements
        env:
          SPATIAL_BASE: ${{ needs.target.outputs.base }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          node scripts/spatial/spatial-check.mjs \
            --base "$SPATIAL_BASE" --shard "$SHARD_INDEX/4" \
            --baseline design/spatial-baseline.json \
            --json "$RUNNER_TEMP/spatial-part.json"
      - name: Keep this shard's measurements, including render failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spatial-part-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/spatial-part.json
          if-no-files-found: warn
          retention-days: 7
  gate:
    needs: [target, measure]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Download measurements from this attempt only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern "spatial-part-${GITHUB_RUN_ATTEMPT}-*" \
            --dir "$RUNNER_TEMP/spatial-parts"
      - name: Require complete coverage and judge the whole deployment
        env:
          SPATIAL_BASE: ${{ needs.target.outputs.base }}
        run: |
          node scripts/spatial/spatial-check.mjs \
            --base "$SPATIAL_BASE" --assemble "$RUNNER_TEMP/spatial-parts" \
            --baseline design/spatial-baseline.json \
            --json "$RUNNER_TEMP/spatial-measurements.json"
      - name: Keep measurements even if the baseline check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spatial-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spatial-measurements.json
          if-no-files-found: warn
          retention-days: 7
      - name: Say plainly what this job did and did not check
        if: always()
        env:
          SPATIAL_BASE: ${{ needs.target.outputs.base }}
        run: |
          {
            echo "### Spatial law"
            echo
            echo "- Selected target: $SPATIAL_BASE"
            echo "- Scope: all receipt and discovered layout routes, at every required width."
            echo "- If a shard must be rerun, rerun all jobs to keep measurements in one attempt."
            echo "- The local prerender gate and falsifier did not run in this workflow."
            echo "- If the browser completed the sweep, the JSON measurements are available under Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
