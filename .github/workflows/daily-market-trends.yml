# Daily market-attention harvest for Time Pop home.
# Pulls Google Trends (US) + Wikipedia pageviews, writes public/data/market_trends.json,
# commits when the ranked list changes, then Cloudflare Pages picks up the push.
name: Daily market trends

on:
  schedule:
    - cron: '15 6 * * *' # 06:15 UTC ≈ 13:15 ICT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-trends
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Harvest Google Trends + Wikipedia
        run: npm run data:trends
      - name: Report snapshot age
        # A missed run (billing, outage, upstream block) used to leave the site
        # serving a stale rank list with no trace in the Actions UI. Print the
        # snapshot age on every run so a drift is visible even when the harvest
        # itself succeeds.
        run: |
          node -e '
            const s = require("./public/data/market_trends.json");
            const age = Math.round((Date.now() - Date.parse(s.as_of)) / 86400000);
            const line = `market_trends as_of=${s.as_of} (${age} day(s) old) rows=${s.count}`;
            console.log(line);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Market attention\n${line}\n`);
            if (age > 2) { console.log("::warning::attention snapshot is more than two days old"); }
          '
      - name: Invariant tests
        run: npm test
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- public/data/market_trends.json data/shared/market_trends.json; then
            echo "No trend delta"
            exit 0
          fi
          git config user.name "time-pop-bot"
          git config user.email "bot@nonarkara.org"
          git add public/data/market_trends.json data/shared/market_trends.json
          git commit -m "data: daily market-attention snapshot

          Google Trends (US) + Wikipedia pageviews for the curated watchlist.
          Home trending band reads this file; attention is not price.

          Co-Authored-By: Cursor <cursoragent@cursor.com>"
          git push
