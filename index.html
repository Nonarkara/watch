<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F0E5" />
    <meta name="description" content="Time Pop — a living archive of watches: sourced dossiers, credited film stills, scarcity without the hype, and honest rehoming briefs." />
    <meta name="robots" content="index, follow" />
    <title>Time Pop — Watches, Stories & Screen</title>
    <link rel="canonical" href="https://watch.nonarkara.org/" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-256.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />
    <meta property="og:title" content="Time Pop" />
    <meta property="og:description" content="Watches as objects and co-stars: sourced dossiers, credited film stills, scarcity without the hype." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Time Pop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://watch.nonarkara.org/" />
    <meta property="og:image" content="https://watch.nonarkara.org/img/hero/time-pop-banner.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="576" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://watch.nonarkara.org/img/hero/time-pop-banner.png" />
    <meta name="twitter:title" content="Time Pop" />
    <meta name="twitter:description" content="Watches as objects and co-stars: sourced dossiers, credited film stills, scarcity without the hype." />
    <!--
      The dataset is 1.6 MB and the app is a single-page app: without this the
      fetch cannot start until the module bundle has downloaded and React has
      mounted, so the reader stares at "LOADING TIME POP…" for the whole of
      that. Measured on this build, the fetch started at 250 ms and the real
      page painted at 482 ms — after the browser had already fired `load`.

      `as="fetch"` with `crossorigin="anonymous"` is what makes the preload
      and the app's own `fetch('/data.json')` share one cache entry, so the
      bytes are downloaded once and used twice, not twice.
    -->
    <link rel="preload" as="fetch" crossorigin="anonymous" href="/data.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/fonts/jost-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <script>
      // Theme bootstrap: read localStorage before React mounts to avoid a
      // flash of the wrong palette. Default: follow system preference.
      (function () {
        try {
          var saved = localStorage.getItem('watch.theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) { /* private mode */ }
      })();
    </script>
    <script>
      window.addEventListener('load', function () {
        import('https://nonarkara.org/_shared/lib/visitor-tracking.js')
          .then(function ({ trackVisit }) { trackVisit({ dashboard: 'WATCH' }); })
          .catch(function () {});
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
